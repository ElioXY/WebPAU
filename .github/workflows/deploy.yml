name: Deploy

on:
  push:
    # Se escuchan ambas ramas para que el flujo no quede muerto si cambia la
    # rama por defecto del repositorio; el job solo publica desde la rama que
    # sea por defecto en ese momento (si no, una rama antigua sobrescribiría
    # la web con contenido viejo).
    branches: [main, mejora-web-espanol]
    paths:
      - 'src/**'
      - 'public/**'
      - 'data/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          SITE_BASE: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository.owner }}.github.io
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
